name: Проверки PA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/verify-package.py
      - run: python tests/run_tests.py --report tests/RESULTS.json
      - run: node tests/test_cef_chat.js
      - shell: powershell
        run: ./tests/test_updater.ps1
      - shell: powershell
        run: ./tests/test_update_legacy_paths.ps1
      - shell: powershell
        run: ./tests/test_update_progress.ps1
      - shell: powershell
        run: ./tests/test_installer.ps1
      - shell: powershell
        run: ./tests/test_installer_legacy_paths.ps1
      - shell: powershell
        run: ./tests/test_setup.ps1
      - shell: powershell
        run: ./tests/test_setup_window.ps1
      - shell: powershell
        run: ./tests/test_author_install.ps1
      - shell: powershell
        run: ./tools/build-update.ps1
      - run: python tools/build-distribution.py
